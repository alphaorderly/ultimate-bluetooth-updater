name: Build updater
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol and transaction tests (no USB)
        run: python -m unittest discover -s tests -v
      - name: Resource and transform smoke test
        run: python main.py --self-test
      - name: Verify public-tree boundary
        run: python tools/audit_public.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
          - os: windows-2022
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Platform tests
        run: python -m unittest discover -s tests -v
      - name: GUI startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py
      - name: Build native application and test bundled executable
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateBluetoothUpdater-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UltimateBluetoothUpdater-*
          path: release
          merge-multiple: true
      - name: Publish beta binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --prerelease --title "Ultimate Bluetooth Updater $RELEASE_TAG" --notes "Community beta for Ultimate Bluetooth only. Includes macOS Apple Silicon, macOS Intel, and Windows x64. On 2026-10-23, the user reported successful physical-device installation with the GUI updater on both macOS and Windows. The firmware has also successfully woken Switch 2 on one controller. Builds include offline transaction tests and packaged GUI startup checks. See README for supported firmware, learning instructions, backup, recovery, and unsigned application notes."
